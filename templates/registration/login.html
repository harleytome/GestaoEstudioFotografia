{% extends "base.html" %}
{% block title %}Login - Gestão de Estúdio{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1>📸 Gestão de Estúdio</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            {% if form.errors %}
            <div class="alert alert-error">Usuário ou senha inválidos.</div>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
